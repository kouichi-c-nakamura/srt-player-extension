<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>SRT Player - 設定</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    width: 320px;
    padding: 12px;
    font-size: 13px;
    background: #1e1e1e;
    color: #eee;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 4px;
  }
  p.desc {
    color: #999;
    font-size: 11px;
    margin: 0 0 10px;
  }
  .current-site {
    background: rgba(255, 255, 255, 0.06);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .current-site .host {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  button {
    background: #444;
    color: #eee;
    border: 1px solid #666;
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover {
    background: #555;
  }
  button.small {
    padding: 2px 6px;
    font-size: 11px;
  }
  .all-sites-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid #444;
  }
  #domainList {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 8px;
    max-height: 200px;
    overflow-y: auto;
  }
  .domain-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
    padding: 4px 8px;
  }
  .domain-row.disabled {
    opacity: 0.4;
  }
  .add-row {
    display: flex;
    gap: 6px;
  }
  .add-row input {
    flex: 1;
    background: #333;
    color: #eee;
    border: 1px solid #666;
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
  }
</style>
</head>
<body>
  <h1>SRT Player &mdash; 有効にするサイト</h1>
  <p class="desc">
    リストにあるサイトでのみ、字幕オーバーレイとパネルが表示されます。
  </p>

  <div class="current-site">
    <span class="host" data-role="current-host">(取得中...)</span>
    <button type="button" class="small" data-role="add-current-btn">このサイトを追加</button>
  </div>

  <label class="all-sites-row">
    <input type="checkbox" data-role="all-sites-checkbox" />
    すべてのサイトで有効にする(リストを無視)
  </label>

  <div id="domainList" data-role="domain-list"></div>

  <div class="add-row">
    <input type="text" data-role="new-domain-input" placeholder="例: youtube.com" />
    <button type="button" data-role="add-domain-btn">追加</button>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
